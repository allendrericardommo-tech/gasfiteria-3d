<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Gasfitería 3D · Obras</title>
<style>
:root{--bg:#f3f4f2;--panel:#fff;--fg:#1d2321;--muted:#5d6763;--line:#d9ddda;--accent:#2a6f73}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141917;--panel:#1b211f;--fg:#e4e8e6;--muted:#9aa5a0;--line:#2e3633;--accent:#6fb8bb}}
:root[data-theme="dark"]{--bg:#141917;--panel:#1b211f;--fg:#e4e8e6;--muted:#9aa5a0;--line:#2e3633;--accent:#6fb8bb}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
nav{display:flex;gap:6px;align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav b{margin-right:8px;white-space:nowrap;font-size:14px}
nav button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:8px 14px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
iframe.activa{display:block}
@media (max-width:820px){main{min-height:calc(100dvh - 54px)} nav b{display:none}}
</style>
<nav role="tablist" aria-label="Obras">
  <b>Gasfitería 3D</b>
  <button role="tab" data-obra="coyhaique" aria-selected="true">Nueva Coyhaique</button>
  <button role="tab" data-obra="baguales" aria-selected="false">Baguales</button>
  <button role="tab" data-obra="nires" aria-selected="false">Los Ñires</button>
</nav>
<main id="main"></main>
<script>
const main = document.getElementById('main');
const marcos = {};
function abrir(obra){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.obra===obra)));
  if (!marcos[obra]){ const f = document.createElement('iframe'); f.src = obra + '.html'; f.title = 'Modelo 3D ' + obra; main.appendChild(f); marcos[obra] = f; }
  Object.entries(marcos).forEach(([k,f])=>f.classList.toggle('activa', k===obra));
  try { history.replaceState(null, '', '#' + obra); } catch(e){}
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>abrir(b.dataset.obra));
const ini = (location.hash || '').slice(1);
abrir(['coyhaique','baguales','nires'].includes(ini) ? ini : 'coyhaique');
</script>
</body></html>
